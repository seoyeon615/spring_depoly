spring:
  datasource:    # "localhost" -> "DB 서비스 이름" 변경
    url: jdbc:mysql://backend-mysql:3306/backend_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=utf8
    username: backend_user
    password: backend_pw
  jpa:
    hibernate.ddl-auto: update
    show-sql: true
    properties.hibernate.format_sql: true # SQL 콘솔 출력을 예쁘게 줄바꿈해주는 설정
server.port: 8080